<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%23B07A2E'/%3E%3Cpath%20fill='%23FFFFFF'%20d='M10%208h7v5l-7%207zM10%2024l7-7v11h24V11.5a3.5%203.5%200%200%201%207%200V39l-7%207v-9H17v16.5a3.5%203.5%200%200%201-7%200zM41%2051h7v-7z'/%3E%3C/svg%3E" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>A Million Times Clock Art</title>
  <style>
  :root {
    --dock-width: 40px;
    --bg-app: #1f2225;        
    --bg-panel: #2a2d31;      
    --bg-canvas: #ffffff;     
    --text: #e6e6e6;
    --text-dim: #9aa0a8;
    --border: #3a3d42;
    --accent: #6ad1ff;
    --shadow: rgba(0,0,0,0.45);
  }
  html.theme-light {
    --bg-app: #ececec;
    --bg-panel: #ffffff;
    --bg-canvas: #ffffff;
    --text: #202225;
    --text-dim: #5a6068;
    --border: #d6d8db;
    --accent: #007aff;
    --shadow: rgba(0,0,0,0.18);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg-app);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    user-select: none;
    transition: background-color 0.4s ease;
  }
    #clock-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-canvas);
      box-shadow: 0 8px 32px var(--shadow);
      padding: 2vmin;
      border-radius: 2vmin;
      transition: background-color 0.4s ease;
    }
    canvas {
      display: block;
    }
    #hud {
      position: fixed;
      top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 999;
      transition: left 0.26s cubic-bezier(0.22, 0.61, 0.36, 1),
                  right 0.26s cubic-bezier(0.22, 0.61, 0.36, 1),
                  top 0.26s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    #hud.side-right { right: 16px; left: auto;  align-items: flex-end; }
    #hud.side-left  { left: 16px;  right: auto; align-items: flex-start; }
    #hud.dragging   { transition: none; align-items: flex-start; }
    .controls {
      position: static;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .controls button {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      color: var(--text);
    }
    .controls button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .controls button:active {
      transform: scale(0.95);
    }
    .controls button svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    .theme-pill {
      display: flex;
      gap: 0;
      background: var(--bg-app);
      padding: 3px;
      border-radius: 6px;
      border: 1px solid var(--border);
      width: fit-content;
    }
    .theme-pill button {
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 5px 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.15s, color 0.15s;
    }
    .theme-pill button.active {
      background: var(--accent);
      color: #0a0a0a;
    }
    .theme-pill button:not(.active):hover {
      color: var(--text);
    }
    #settings-modal {
      display: none;
      position: static;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 12px 32px var(--shadow);
      z-index: 1000;
      width: 280px;
      max-height: calc(100vh - 90px);
      overflow-y: auto;
      animation: modalFadeIn 0.18s ease;
      cursor: grab;
    }
    #hud.dragging #settings-modal {
      cursor: grabbing;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #settings-modal h3 {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    #settings-modal .setting {
      margin-bottom: 12px;
    }
    #settings-modal .setting > label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }
    #settings-modal label {
      font-size: 13px;
      color: var(--text);
      margin-right: 10px;
    }
    #settings-modal input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      outline: none;
      transition: opacity 0.2s;
    }
    #settings-modal input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid var(--bg-panel);
    }
    #settings-modal input[type="range"]::-moz-range-thumb {
      background: var(--accent);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid var(--bg-panel);
    }
    .slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .slider-container input {
      flex-grow: 1;
    }
    .slider-container span {
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: var(--text-dim);
      min-width: 42px;
      text-align: right;
    }
    .setting-checkbox {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .setting-checkbox label {
      margin-right: 0;
      font-size: 13px;
    }
    .setting-checkbox input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .btn-row {
      display: flex;
      gap: 6px;
    }
    .btn-row button {
      background: var(--bg-app);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      flex: 1;
    }
    .btn-row button:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn-row button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-row button.active {
      background: var(--accent);
      color: #0a0a0a;
      border-color: var(--accent);
    }
    .credit {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .credit-avatar {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #36353A;
      display: block;
      line-height: 0;
    }
    .credit-avatar svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    .credit a {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      line-height: 1.35;
    }
    .credit a:hover {
      text-decoration: underline;
    }
    .setting-label-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .setting-label-row > label {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div id="clock-container">
    <canvas id="c" aria-label="Animated clock display showing the current time"></canvas>
  </div>
  <div id="hud" class="side-right">
  <div class="controls">
    <button id="settings-btn" title="Settings">

    </button>
  </div>

  <div id="settings-modal">
    <h3>Settings</h3>
    <div class="setting">
      <label>Theme</label>
      <div class="theme-pill" id="theme-pill">
        <button data-theme="dark" class="active">Dark</button>
        <button data-theme="light">Light</button>
      </div>
    </div>
    <div class="setting">
      <label>Pattern</label>
      <div class="btn-row">
        <button id="pattern-prev-btn">Previous</button>
        <button id="pattern-next-btn">Next</button>
      </div>
      <div class="btn-row" style="margin-top:6px;">
        <button id="show-time-btn">Show time</button>
      </div>
    </div>
    <div class="setting">
      <div class="setting-label-row">
        <label>Clock grid</label>
      </div>
      <div class="slider-container">
        <input type="range" id="cols-slider" min="8" max="24" step="1" value="24" aria-label="Columns">
        <span id="cols-value">24</span>
      </div>
      <div class="slider-container" style="margin-top:8px;">
        <input type="range" id="rows-slider" min="3" max="14" step="1" value="12" aria-label="Rows">
        <span id="rows-value">12</span>
      </div>
    </div>
    <div class="setting setting-checkbox">
      <label for="hour-format-toggle">24‑hour format</label>
      <input type="checkbox" id="hour-format-toggle" checked>
    </div>
    <div class="setting setting-checkbox">
      <label for="mouse-follow-toggle">Mouse follow</label>
      <input type="checkbox" id="mouse-follow-toggle">
    </div>
    <div class="setting">
      <label>Fullscreen</label>
      <div class="btn-row">
        <button id="fullscreen-btn">Toggle fullscreen</button>
      </div>
    </div>
    <div class="setting">
      <label for="transition-slider">Transition Speed</label>
      <div class="slider-container">
        <input type="range" id="transition-slider" min="1" max="20" step="0.2">
        <span id="transition-value">1.0s</span>
      </div>
    </div>

    <div class="credit">
      <span class="credit-avatar" aria-hidden="true">

    g: 20,
    b: 24,
    a: 1
  };
  handColor = {
    r: 240,
    g: 240,
    b: 240,
    a: 1
  };
  shadowColor = deriveShadow(backColor);
  document.getElementById("clock-container").style.backgroundColor = `rgb(${backColor.r}, ${backColor.g}, ${backColor.b})`;
  const nowSec = performance.now() / 1e3;
  patternIndex = 4;
  applyPattern(patternIndex, nowSec);
  nextPatternSwitchSec = nowSec + PatternPeriodSeconds;
  isAnimating = true;
  lastRenderSec = 0;
  requestAnimationFrame(tick);
  setupControls();
  setInterval(() => {
    if (patternIndex === 4) {
      const nowSec = performance.now() / 1e3;
      const d = new Date;
      const layout = currentTimeLayout || chooseTimeLayout(Cols, Rows);
      const sig = layout && layout.fields >= 3 ? d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds() : d.getHours() * 60 + d.getMinutes();
      if (sig !== _lastTimeSig) {
        _lastTimeSig = sig;
        const prevDur = TransitionSeconds;
        TransitionSeconds = .4;
        applyPattern(4, nowSec);
        TransitionSeconds = prevDur;
        PatternPeriodSeconds = prevDur + 5;
        isAnimating = true;
      }
    }
  }, 250);
  let _lastTimeSig = -1;
  const SCROLL_STEP_MS = 700;
  setInterval(() => {
    if (patternIndex === 20 && !mouseFollowActive) {
      scrollOffset += 1;
      const nowSec = performance.now() / 1e3;
      const prevDur = TransitionSeconds;
      TransitionSeconds = SCROLL_STEP_MS / 1000;
      applyPattern(20, nowSec);
      TransitionSeconds = prevDur;
      isAnimating = true;
    }
  }, SCROLL_STEP_MS);
})();
</script>
