<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>A Million Times Clock Art</title>
  <style>
  :root {
    --top-panel-height: 40px;  
    --dock-width: 40px;        
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0a0a0a; 
    user-select: none;
   }
    #clock-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      padding: 2vmin;
      border-radius: 2vmin;
      transition: background-color 0.4s ease;
    }
    canvas {
      display: block;
    }
    .controls {
      position: fixed;
      top: calc(var(--top-panel-height));
      right: 20px;
      display: flex;
      gap: 8px;
      z-index: 999;
    }
    .controls button {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 5px;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      transition: background 0.2s;
    }
    .controls button:hover {
      background: white;
    }
    .controls button svg {
      width: 24px;
      height: 24px;
      fill: #333;
    }

    #settings-modal {
      display: none;
      position: fixed;
      top: 60px;
      right: 10px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #settings-modal h3 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }
    #settings-modal .setting {
      margin-bottom: 8px;
    }
    #settings-modal label {
      font-size: 14px;
      color: #333;
      margin-right: 10px;
    }
    #settings-modal input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: var(--slider-track);
      outline: none;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    #settings-modal input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #007bff;
      cursor: pointer;
    }
    #settings-modal input[type="range"]::-moz-range-track {
      background: var(--slider-track);
      height: 4px;
      border-radius: 2px;
    }
    #settings-modal input[type="range"]::-moz-range-thumb {
      background: #007bff;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      cursor: pointer;
    }
    #settings-modal input[type="range"]:hover {
      opacity: 1;
    }
    .color-swatches {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .swatch-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .color-swatch {
      width: 100%;
      height: 30px;
      border: 2px solid transparent;
      border-radius: 5px;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .color-swatch.active {
      border-color: #007aff;
      box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.2);
    }
    .swatch-label {
      font-size: 10px;
      text-align: center;
      color: inherit;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .slider-container input {
      flex-grow: 1;
    }
    :root {
      --slider-track: rgba(0, 0, 0, 0.1);
      --slider-thumb: #007bff;
    }
    .setting-checkbox {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .setting-checkbox label {
      margin-right: 0;
    }
    .setting-checkbox input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    #custom-color-pickers {
      display: none;
      margin-top: 4px;
    }
    #custom-color-pickers .color-picker-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    #custom-color-pickers .color-picker-row label {
      margin-right: 0;
      font-size: 13px;
    }
    #custom-color-pickers input[type="color"] {
      width: 40px;
      height: 25px;
      border: none;
      padding: 0;
      background: none;
      cursor: pointer;
    }
    .hint {
      font-size: 12px;
      margin-top: 6px;
      color: #666;
      border-top: 1px solid #eee;
      padding-top: 4px;
    }
    kbd {
      background: #e0e0e0;
      border-radius: 4px;
      padding: 2px 6px;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      color: #333;
    }
    details {
      margin-top: 6px;
      font-size: 12px;
      color: #666;
      border-top: 1px solid #eee;
      padding-top: 4px;
    }
    details summary {
      cursor: pointer;
      font-weight: 500;
      outline: none;
      user-select: none;
    }
    details[open] summary {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div id="clock-container">
    <canvas id="c" aria-label="Animated clock display showing the current time"></canvas>
  </div>
  <div class="controls">
    <button id="settings-btn" title="Settings">
      <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
    </button>
  </div>

  <div id="settings-modal">
    <h3>Settings</h3>
    <div class="setting">
      <label>Theme</label>
      <div id="color-swatches" class="color-swatches"></div>
      <div id="custom-color-pickers">
        <div class="color-picker-row">
          <label for="custom-background">Background</label>
          <input type="color" id="custom-background" value="#ffffff">
        </div>
        <div class="color-picker-row">
          <label for="custom-hand">Hands</label>
          <input type="color" id="custom-hand" value="#000000">
        </div>
      </div>
    </div>
    <div class="setting">
      <label for="transition-slider">Transition Speed</label>
      <div class="slider-container">
        <input type="range" id="transition-slider" min="1" max="20" step="0.2">
        <span id="transition-value">20.0s</span>
      </div>
      <details>
        <summary>Keyboard shortcuts</summary>
        <div class="hint">
          Press <kbd>C</kbd> to change pattern
        </div>
        <div class="hint">
          Press <kbd>F</kbd> to Show/Hide Settings
        </div>
        <div class="hint">
          Press <kbd>M</kbd> to follow cursor / resume animation
        </div>
        <div class="hint">
          Press <kbd>R</kbd> for random theme
        </div>
        <div class="hint">
          Press <kbd>Space</kbd> to see time
        </div>
      </details>
    </div>
  </div>

<script>
(() => {
  const Cols = 16;
  const Rows = 8;

  let backColor   = { r: 255, g: 255, b: 255, a: 1.0 };
  let handColor   = { r:   0, g:   0, b:   0, a: 1.0 };
  let shadowColor = { r: 200, g: 200, b: 200, a: 0.61 }; 

  let TransitionSeconds = 20.0;
  let is24Hour = true;

  const MAX_FPS = 20;
  const FRAME_INTERVAL = 1 / MAX_FPS;
  let lastRenderSec = 0;

  const HAND_SHADOW_OFFSET = 4;
  const HAND_SHADOW_BLUR   = 8;
  const HAND_SHADOW_ALPHA  = 0.30;
  const MOUSE_FOLLOW_SMOOTHING = 0.03;

  let PatternPeriodSeconds = TransitionSeconds;
  const totalPattern = 12;
  let patternIndex = 4;

  let colorTransition = null;

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp  = (a, b, t) => a + (b - a) * t;
  const lerpColor = (c1, c2, t) => ({
    r: Math.round(lerp(c1.r, c2.r, t)),
    g: Math.round(lerp(c1.g, c2.g, t)),
    b: Math.round(lerp(c1.b, c2.b, t)),
    a: lerp(c1.a, c2.a, t)
  });

  function startColorTransition(targetBack, targetHand, targetShadow) {
    colorTransition = {
      startBack: { ...backColor },
      startHand: { ...handColor },
      startShadow: { ...shadowColor },
      targetBack: { ...targetBack },
      targetHand: { ...targetHand },
      targetShadow: { ...targetShadow },
      startSec: performance.now() / 1000,
      duration: 0.4
    };
  }

  function deriveShadow(bg) {
    const factor = 0.6;
    return {
      r: Math.round(bg.r * factor),
      g: Math.round(bg.g * factor),
      b: Math.round(bg.b * factor),
      a: 0.6
    };
  }

  function updateModalTheme() {
    const modal = document.getElementById('settings-modal');
    if (!modal) return;

    const bgColor = `rgb(${backColor.r}, ${backColor.g}, ${backColor.b})`;
    modal.style.backgroundColor = bgColor;

    const luminance = (0.299 * backColor.r + 0.587 * backColor.g + 0.114 * backColor.b) / 255;
    const textColor = luminance > 0.5 ? '#333' : '#f0f0f0';
    modal.style.color = textColor;
    modal.style.borderColor = luminance > 0.5 ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.2)';

    const trackColor = luminance > 0.5 ? 'rgba(0,0,0,0.2)' : 'rgba(255,255,255,0.3)';
    document.documentElement.style.setProperty('--slider-track', trackColor);

    const headings = modal.querySelectorAll('h3, label');
    headings.forEach(el => el.style.color = textColor);

    const hints = modal.querySelectorAll('.hint, details, summary');
    hints.forEach(h => h.style.color = textColor);
  }

  function normalizeDeg(deg) {
    deg %= 360;
    if (deg < 0) deg += 360;
    return deg;
  }

  function shortestDeltaDeg(fromDeg, toDeg) {
    let d = normalizeDeg(toDeg) - normalizeDeg(fromDeg);
    d = (d + 540) % 360 - 180;
    return d;
  }

  function interpAngleDeg(startDeg, targetDeg, t) {
    const s = normalizeDeg(startDeg);
    const e = normalizeDeg(targetDeg);
    const delta = shortestDeltaDeg(s, e);
    return normalizeDeg(s + delta * t);
  }

  function smoothStep(t) {
    t = clamp(t, 0, 1);
    return t * t * (3 - 2 * t);
  }

  const clockStates = [
    { a: 0,   b: 0   },
    { a: 0,   b: 90  },
    { a: 0,   b: 180 },
    { a: 0,   b: 270 },
    { a: 90,  b: 90  },
    { a: 90,  b: 180 },
    { a: 90,  b: 270 },
    { a: 180, b: 180 },
    { a: 180, b: 270 },
    { a: 270, b: 270 },
    { a: 0,   b: 225 },
    { a: 45,  b: 180 },
    { a: 225, b: 225 },
  ];

  const numberPatterns = [
    [[5,6,8],[2,7,2],[2,2,2],[2,2,2],[2,0,2],[1,6,3]],
    [[12,5,8],[12,2,2],[12,2,2],[12,2,2],[12,2,2],[12,1,3]],
    [[5,6,8],[1,8,2],[5,3,2],[2,5,3],[2,1,8],[1,6,3]],
    [[5,6,8],[1,8,2],[5,3,2],[1,8,2],[5,3,2],[1,6,3]],
    [[5,8,8],[2,2,2],[2,1,2],[1,8,2],[12,2,2],[12,1,3]],
    [[5,6,8],[2,5,3],[2,1,8],[1,8,2],[5,3,2],[1,6,3]],
    [[5,6,8],[2,5,3],[2,1,8],[2,7,2],[2,0,2],[1,6,3]],
    [[5,6,8],[1,8,2],[12,10,10],[11,11,12],[2,2,12],[1,3,12]],
    [[5,6,8],[2,7,2],[2,0,2],[2,7,2],[2,0,2],[1,6,3]],
    [[5,6,8],[2,7,2],[2,0,2],[1,8,2],[5,3,2],[1,6,3]],
  ];

  function getClockStateForNumber(num, rowInDigit, colInDigit) {
    const idx = numberPatterns[num][rowInDigit][colInDigit];
    return clockStates[idx];
  }

  function createTimePattern(date) {
    const timePosX = 1;
    const timePosY = 1;
    const pattern = new Array(Cols * Rows);

    let hours = date.getHours();
    if (!is24Hour) {
      hours = hours % 12;
      if (hours === 0) hours = 12;
    }
    const minutes = date.getMinutes();

    const hTens = Math.floor(hours / 10);
    const hUnits = hours % 10;
    const mTens = Math.floor(minutes / 10);
    const mUnits = minutes % 10;

    for (let row = 0; row < Rows; row++) {
      for (let col = 0; col < Cols; col++) {
        const localRow = row - timePosX;
        const localCol = col - timePosY;
        const idx = row * Cols + col;

        if (localRow >= 0 && localCol >= 0 && localRow < 6 && localCol < 14) {
          if (localCol < 3) {
            pattern[idx] = getClockStateForNumber(hTens, localRow, localCol);
          } else if (localCol < 6) {
            pattern[idx] = getClockStateForNumber(hUnits, localRow, localCol - 3);
          } else if (localCol < 8) {
            if (localCol === 6) {
              if (localRow === 1 || localRow === 3) pattern[idx] = clockStates[5];
              else if (localRow === 2 || localRow === 4) pattern[idx] = clockStates[1];
              else pattern[idx] = clockStates[12];
            } else if (localCol === 7) {
              if (localRow === 1 || localRow === 3) pattern[idx] = clockStates[8];
              else if (localRow === 2 || localRow === 4) pattern[idx] = clockStates[3];
              else pattern[idx] = clockStates[12];
            }
          } else if (localCol < 11) {
            pattern[idx] = getClockStateForNumber(mTens, localRow, localCol - 8);
          } else if (localCol < 14) {
            pattern[idx] = getClockStateForNumber(mUnits, localRow, localCol - 11);
          }
        } else {
          pattern[idx] = clockStates[12];
        }
      }
    }
    return pattern;
  }

  class Clock {
    constructor() {
      this.angleA = 0;
      this.angleB = 0;
      this.animA = null;
      this.animB = null;
    }

    setTargets(targetA, targetB, durationSeconds, nowSec) {
      if (durationSeconds <= 0) {
        this.angleA = normalizeDeg(targetA);
        this.angleB = normalizeDeg(targetB);
        this.animA = null;
        this.animB = null;
        return;
      }
      this.animA = {
        startDeg: this.angleA,
        targetDeg: normalizeDeg(targetA),
        startSec: nowSec,
        endSec: nowSec + durationSeconds
      };
      this.animB = {
        startDeg: this.angleB,
        targetDeg: normalizeDeg(targetB),
        startSec: nowSec,
        endSec: nowSec + durationSeconds
      };
    }

    update(nowSec) {
      if (this.animA) {
        const denom = this.animA.endSec - this.animA.startSec;
        let t = denom <= 1e-9 ? 1 : (nowSec - this.animA.startSec) / denom;
        t = clamp(t, 0, 1);
        this.angleA = interpAngleDeg(this.animA.startDeg, this.animA.targetDeg, t);
        if (t >= 1) this.animA = null;
      }
      if (this.animB) {
        const denom = this.animB.endSec - this.animB.startSec;
        let t = denom <= 1e-9 ? 1 : (nowSec - this.animB.startSec) / denom;
        t = clamp(t, 0, 1);
        this.angleB = interpAngleDeg(this.animB.startDeg, this.animB.targetDeg, t);
        if (t >= 1) this.animB = null;
      }
    }
  }

  const clocks = [];
  function createClocks() {
    clocks.length = 0;
    for (let i = 0; i < Cols * Rows; i++) clocks.push(new Clock());
  }

  function getPatternAngles(row, col, rows, cols, quantize = false) {
    const cx = (cols - 1) * 0.5;
    const cy = (rows - 1) * 0.5;

    let dx = col - cx;
    let dy = row - cy;

    const aspect = rows / cols;
    dx *= aspect;

    const maxDx = cx * aspect;
    const maxDy = cy;
    const maxR = Math.sqrt(maxDx * maxDx + maxDy * maxDy);
    const r = Math.sqrt(dx * dx + dy * dy);
    const rn = maxR <= 1e-6 ? 0 : (r / maxR);

    let radialDeg = Math.atan2(dy, dx) * 180 / Math.PI;
    radialDeg = normalizeDeg(radialDeg + 90);

    const tangentDeg = normalizeDeg(radialDeg + 90);

    const spreadCenter = 55;
    const spreadOuter = 10;
    const spread = lerp(spreadCenter, spreadOuter, smoothStep(rn));

    let a = normalizeDeg(tangentDeg - spread);
    let b = normalizeDeg(tangentDeg + spread);

    if (quantize) {
      const step = 15;
      a = normalizeDeg(Math.round(a / step) * step);
      b = normalizeDeg(Math.round(b / step) * step);
    }
    return [a, b];
  }

  function getPatternAnglesCircleOpen(row, col, rows, cols, cxRatio = 0.5, cyRatio = 0.5, spreadCenter = 20) {
    const cx = (cols - 1) * cxRatio;
    const cy = (rows - 1) * cyRatio;

    const dx = col - cx;
    const dy = row - cy;

    const maxDx = cx * 2;
    const maxDy = cy * 2;
    const maxR = Math.sqrt(maxDx * maxDx + maxDy * maxDy);
    const r = Math.sqrt(dx * dx + dy * dy);
    const rn = maxR <= 1e-6 ? 0 : (r / maxR);
    const rnInv = 1 - rn;

    const spreadOuter = 1;
    const spread = lerp(spreadOuter, spreadCenter, Math.pow(rnInv, 4));

    let radialDeg = Math.atan2(dy, dx) * 180 / Math.PI;
    radialDeg = normalizeDeg(radialDeg + 90);

    const tangentDeg = normalizeDeg(radialDeg + 90);

    const a = normalizeDeg(tangentDeg + spread);
    const b = normalizeDeg(tangentDeg + 180 - spread);
    return [a, b];
  }

  function getPatternVector(row, col, rows, cols, cxRatio = 0.5, cyRatio = 0.5) {
    const cx = (cols - 1) * cxRatio;
    const cy = (rows - 1) * cyRatio;

    const dx = col - cx;
    const dy = row - cy;

    let radialDeg = Math.atan2(dy, dx) * 180 / Math.PI;
    radialDeg = normalizeDeg(radialDeg + 90);

    const a = normalizeDeg(radialDeg);
    const b = normalizeDeg(radialDeg + 180);
    return [a, b];
  }

  function getPatternVectorTangent(row, col, rows, cols, cxRatio = 0.5, cyRatio = 0.5) {
    const cx = (cols - 1) * cxRatio;
    const cy = (rows - 1) * cyRatio;

    const dx = col - cx;
    const dy = row - cy;

    let radialDeg = Math.atan2(dy, dx) * 180 / Math.PI;
    radialDeg = normalizeDeg(radialDeg + 90);

    const a = normalizeDeg(radialDeg);
    const b = normalizeDeg(radialDeg + 180);
    return [a, b];
  }

  class VortexField {
    constructor(cfg) { this.cfg = cfg; }

    vField(x, y) {
      let u = 0, v = 0;
      const eps = this.cfg.Eps;

      for (const vt of this.cfg.Vortices) {
        const dx = x - vt.Cx;
        const dy = y - vt.Cy;
        const r2 = dx * dx + dy * dy + eps;
        u += -vt.Strength * dy / r2;
        v +=  vt.Strength * dx / r2;
      }

      u += this.cfg.BackgroundU + this.cfg.WaveUCosAmp * Math.cos(2 * Math.PI * y);
      v += this.cfg.WaveVSinAmp * Math.sin(2 * Math.PI * x);

      return { u, v };
    }

    rk4Step(p, h) {
      const k1 = this.vField(p.x, p.y);
      const k2 = this.vField(p.x + 0.5 * h * k1.u, p.y + 0.5 * h * k1.v);
      const k3 = this.vField(p.x + 0.5 * h * k2.u, p.y + 0.5 * h * k2.v);
      const k4 = this.vField(p.x + h * k3.u, p.y + h * k3.v);

      return {
        x: p.x + (h / 6) * (k1.u + 2 * k2.u + 2 * k3.u + k4.u),
        y: p.y + (h / 6) * (k1.v + 2 * k2.v + 2 * k3.v + k4.v)
      };
    }

    cellCenterToField(x, y, cols, rows) {
      const fx = (x + 0.5) / cols;
      const fy = (y + 0.5) / rows;

      const X = lerp(this.cfg.XMin, this.cfg.XMax, fx);
      const Y = lerp(this.cfg.YMax, this.cfg.YMin, fy);

      return { x: X, y: Y };
    }

    degreesFromVectorUp0CW(vx, vy) {
      let r = Math.atan2(vx, -vy);
      let deg = r * 180 / Math.PI;
      deg %= 360;
      if (deg < 0) deg += 360;
      return deg;
    }

    getAngleDegrees(x, y, cols, rows) {
      const pField = this.cellCenterToField(x, y, cols, rows);

      let p2 = { ...pField };
      const steps = Math.max(1, this.cfg.Steps | 0);
      for (let i = 0; i < steps; i++) p2 = this.rk4Step(p2, this.cfg.StepSize);

      let dfx = p2.x - pField.x;
      let dfy = p2.y - pField.y;

      if ((dfx * dfx + dfy * dfy) < 1e-12) {
        const inst = this.vField(pField.x, pField.y);
        dfx = inst.u;
        dfy = inst.v;
      }

      const dsx = dfx;
      const dsy = -dfy;

      return this.degreesFromVectorUp0CW(dsx, dsy);
    }
  }

  let currentTimePattern = new Array(Cols * Rows).fill(clockStates[12]);
  let nextPatternSwitchSec = 0;

  function applyPattern(pIndex, nowSec) {
    let idx = 0;

    for (let row = 0; row < Rows; row++) {
      for (let col = 0; col < Cols; col++) {
        let aDeg = 0, bDeg = 90;

        if (pIndex === 0) {
          [aDeg, bDeg] = getPatternVector(row, col, Rows, Cols);
          PatternPeriodSeconds = TransitionSeconds;
        }
        else if (pIndex === 1) {
          [aDeg, bDeg] = getPatternAnglesCircleOpen(row, col, Rows, Cols, 0.5, 0.5, 0);
          PatternPeriodSeconds = TransitionSeconds;
        }
        else if (pIndex === 2) {
          [aDeg, bDeg] = getPatternAnglesCircleOpen(row, col, Rows, Cols);
          PatternPeriodSeconds = TransitionSeconds;
        }
        else if (pIndex === 3) {
          [aDeg, bDeg] = getPatternAnglesCircleOpen(row, col, Rows, Cols, 0.5, 0.5, 110);
          PatternPeriodSeconds = TransitionSeconds;
        }
        else if (pIndex === 4) {
          currentTimePattern = createTimePattern(new Date());
          const st = currentTimePattern[idx];
          aDeg = st.a;
          bDeg = st.b;
          PatternPeriodSeconds = TransitionSeconds + 5;
        }
        else if (pIndex === 5) {
          const cfg = {
            XMin: -1.0, XMax:  1.0,
            YMin: -0.5, YMax:  0.5,
            Vortices: [
              { Cx: -1.0, Cy: 0.7, Strength:  1.5 },
              { Cx:  0.6, Cy: 0.7, Strength: -1.5 },
            ],
            Eps: 1e-3,
            BackgroundU: 0.20,
            WaveUCosAmp: 0.06,
            WaveVSinAmp: 0.06,
            Steps: 1,
            StepSize: 0.012
          };
          const field = new VortexField(cfg);
          const angle = field.getAngleDegrees(col, row, Cols, Rows);
          aDeg = angle;
          bDeg = normalizeDeg(angle + 180);
          PatternPeriodSeconds = TransitionSeconds;
        }
        else if (pIndex === 6) {
          const cfg = {
            XMin: -1.0, XMax:  1.0,
            YMin: -0.5, YMax:  0.5,
            Vortices: [
              { Cx: -0.6, Cy: 0.7, Strength:  1.5 },
              { Cx:  1.5, Cy: 0.7, Strength: -1.5 },
            ],
            Eps: 1e-3,
            BackgroundU: 0.20,
            WaveUCosAmp: 0.06,
            WaveVSinAmp: 0.06,
            Steps: 1,
            StepSize: 0.012
          };
          const field = new VortexField(cfg);
          const angle = field.getAngleDegrees(col, row, Cols, Rows);
          aDeg = angle;
          bDeg = normalizeDeg(angle + 180);
          PatternPeriodSeconds = TransitionSeconds;
        }
        else if (pIndex === 7) {
          aDeg = col * 10;
          bDeg = normalizeDeg(aDeg + 180);
          PatternPeriodSeconds = TransitionSeconds;
        }
        else if (pIndex === 8) {
          const layer = Math.min(
            row,
            col,
            Rows - 1 - row,
            Cols - 1 - col
          );

          const isTopLeft     = (row === layer && col === layer);
          const isTopRight    = (row === layer && col === Cols - 1 - layer);
          const isBottomLeft  = (row === Rows - 1 - layer && col === layer);
          const isBottomRight = (row === Rows - 1 - layer && col === Cols - 1 - layer);

          if (isTopLeft) {
            aDeg = 90;
            bDeg = 180;
          }
          else if (isTopRight) {
            aDeg = 180;
            bDeg = 270;
          }
          else if (isBottomLeft) {
            aDeg = 0;
            bDeg = 90;
          }
          else if (isBottomRight) {
            aDeg = 0;
            bDeg = 270;
          }
          else if (row === layer || row === Rows - 1 - layer) {
            aDeg = 90;
            bDeg = 270;
          }
          else if (col === layer || col === Cols - 1 - layer) {
            aDeg = 0;
            bDeg = 180;
          }
          else {
            aDeg = 0;
            bDeg = 90;
          }

          PatternPeriodSeconds = Math.max(TransitionSeconds, 2.0);
        }
        else if (pIndex === 9) {
          const halfRows = Rows / 2;
          const halfCols = Cols / 2;

          const qRow = Math.floor(row / halfRows);
          const qCol = Math.floor(col / halfCols);
          const lRow = row % halfRows;
          const lCol = col % halfCols;

          const onOuterTop    = lRow === 0;
          const onOuterBottom = lRow === halfRows - 1;
          const onOuterLeft   = lCol === 0;
          const onOuterRight  = lCol === halfCols - 1;

          const innerMargin = 1;
          const onInnerTop    = lRow === innerMargin;
          const onInnerBottom = lRow === halfRows - 1 - innerMargin;
          const onInnerLeft   = lCol === innerMargin;
          const onInnerRight  = lCol === halfCols - 1 - innerMargin;

          const isOuterTopLeft     = onOuterTop && onOuterLeft;
          const isOuterTopRight    = onOuterTop && onOuterRight;
          const isOuterBottomLeft  = onOuterBottom && onOuterLeft;
          const isOuterBottomRight = onOuterBottom && onOuterRight;

          const isInnerTopLeft     = onInnerTop && onInnerLeft;
          const isInnerTopRight    = onInnerTop && onInnerRight;
          const isInnerBottomLeft  = onInnerBottom && onInnerLeft;
          const isInnerBottomRight = onInnerBottom && onInnerRight;

          function setCornerAngles(isTL, isTR, isBL, isBR) {
            if (isTL) {
              aDeg = 90;
              bDeg = 180;
            }
            else if (isTR) {
              aDeg = 180;
              bDeg = 270;
            }
            else if (isBL) {
              aDeg = 0;
              bDeg = 90;
            }
            else if (isBR) {
              aDeg = 0;
              bDeg = 270;
            }
          }

          if (isOuterTopLeft || isOuterTopRight || isOuterBottomLeft || isOuterBottomRight) {
            setCornerAngles(isOuterTopLeft, isOuterTopRight, isOuterBottomLeft, isOuterBottomRight);
          }
          else if (onOuterTop || onOuterBottom) {
            aDeg = 90;
            bDeg = 270;
          }
          else if (onOuterLeft || onOuterRight) {
            aDeg = 0;
            bDeg = 180;
          }
          else if (isInnerTopLeft || isInnerTopRight || isInnerBottomLeft || isInnerBottomRight) {
            setCornerAngles(isInnerTopLeft, isInnerTopRight, isInnerBottomLeft, isInnerBottomRight);
          }
          else if (onInnerTop || onInnerBottom) {
            aDeg = 90;
            bDeg = 270;
          }
          else if (onInnerLeft || onInnerRight) {
            aDeg = 0;
            bDeg = 180;
          }
          else {
            aDeg = 0;
            bDeg = 0;
          }

          PatternPeriodSeconds = Math.max(TransitionSeconds, 2.0);
        }
        else if (pIndex === 10) {
          const localRow = row % 2;
          const localCol = col % 2;

          if (localRow === 0 && localCol === 0) {
            aDeg = 90;
            bDeg = 180;
          }
          else if (localRow === 0 && localCol === 1) {
            aDeg = 180;
            bDeg = 270;
          }
          else if (localRow === 1 && localCol === 0) {
            aDeg = 0;
            bDeg = 90;
          }
          else if (localRow === 1 && localCol === 1) {
            aDeg = 0;
            bDeg = 270;
          }

          PatternPeriodSeconds = Math.max(TransitionSeconds, 2.0);
        }
        else if (pIndex === 11) {
          if ((row % 2) === (col % 2)) {
            aDeg = 135;
            bDeg = 315;
          } else {
            aDeg = 45;
            bDeg = 225;
          }
          PatternPeriodSeconds = Math.max(TransitionSeconds, 2.0);
        }

        clocks[idx].setTargets(aDeg, bDeg, TransitionSeconds, nowSec);
        idx++;
      }
    }
  }

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let cellSize = 50;
  let radius, lenA, lenB, thickA, thickB, hubR, pad;
  const clockFaceCanvas = document.createElement('canvas');
  const clockFaceCtx = clockFaceCanvas.getContext('2d');
  let isAnimating = true;
  let mouseFollowActive = false;
  let lastPatternIndexBeforeMouse = 3;
  let mouseCanvasX = -1000;
  let mouseCanvasY = -1000;

  function rgba(c) {
    return `rgba(${c.r},${c.g},${c.b},${c.a})`;
  }

  function resize() {
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const PANEL_H = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--top-panel-height')) || 36;
    const DOCK_W  = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dock-width')) || 68;

    const maxW = (window.innerWidth - DOCK_W) * 0.92;
    const maxH = (window.innerHeight - PANEL_H) * 0.92;

    cellSize = Math.floor(Math.min(maxW / Cols, maxH / Rows));

    pad = cellSize * 0.03;
    const cssW = Math.floor(cellSize * Cols + pad);
    const cssH = Math.floor(cellSize * Rows + pad);

    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";

    const bufW = Math.floor(cssW * dpr);
    const bufH = Math.floor(cssH * dpr);

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      mouseCanvasX = e.clientX - rect.left;
      mouseCanvasY = e.clientY - rect.top;
    });

    if (canvas.width === bufW && canvas.height === bufH) return;

    canvas.width = bufW;
    canvas.height = bufH;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    pad = cellSize * 0.03;

    const diameter = cellSize * 0.98;
    radius = diameter / 2;

    lenA = radius * 0.95;
    lenB = radius * 0.85;
    thickA = Math.max(2, radius * 0.1);
    thickB = thickA;
    hubR = thickA / 2;

    clockFaceCanvas.width = Math.ceil(diameter * dpr);
    clockFaceCanvas.height = Math.ceil(diameter * dpr);
    clockFaceCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    clockFaceCtx.clearRect(0, 0, diameter, diameter);
    drawClockFace(radius, radius, radius, clockFaceCtx);

    isAnimating = true;
  }

  function rerenderClockFace() {
    clockFaceCtx.clearRect(0, 0, clockFaceCanvas.width, clockFaceCanvas.height);
    drawClockFace(radius, radius, radius, clockFaceCtx);
  }

  function drawClockFace(cx, cy, r, targetCtx = ctx) {
    const gx = cx + r * 0.25;
    const gy = cy + r * 0.25;
    const grad = targetCtx.createRadialGradient(gx, gy, r * 0.6, cx, cy, r);
    faceColor = { r: backColor.r - 10, g: backColor.g - 10, b: backColor.b - 10, a: 1.0 };
    grad.addColorStop(0, rgba(faceColor));
    grad.addColorStop(0.7, rgba(faceColor));
    grad.addColorStop(1, rgba(shadowColor));

    targetCtx.beginPath();
    targetCtx.arc(cx, cy, r, 0, Math.PI * 2);
    targetCtx.closePath();
    targetCtx.fillStyle = grad;
    targetCtx.fill();
  }

  function roundedRectPath(x, y, w, h, r) {
    r = Math.min(r, Math.min(w, h) / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHand(cx, cy, angleDeg, length, thickness, shadowOffsetPx, shadowBlurPx) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angleDeg * Math.PI / 180);

    const x = -thickness / 2;
    const y = -length;
    const w = thickness;
    const h = length;
    const corner = Math.min(thickness * 0.3, length * 0.1);

    ctx.shadowColor = `rgba(0,0,0,${HAND_SHADOW_ALPHA})`;
    ctx.shadowBlur = shadowBlurPx;
    ctx.shadowOffsetX = shadowOffsetPx;
    ctx.shadowOffsetY = shadowOffsetPx;

    ctx.fillStyle = rgba(handColor);
    roundedRectPath(x, y, w, h, corner);
    ctx.fill();

    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;

    ctx.restore();
  }

  function draw(nowSec) {
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const w = canvas.width;
    const h = canvas.height;

    ctx.clearRect(0, 0, w, h);
    ctx.imageSmoothingEnabled = true;

    const diameter = radius * 2;
    const offset = (cellSize - diameter) / 2;

    const shadowOffsetPx = HAND_SHADOW_OFFSET;
    const shadowBlurPx   = HAND_SHADOW_BLUR;

    let idx = 0;
    for (let row = 0; row < Rows; row++) {
      for (let col = 0; col < Cols; col++) {
        const cx = pad + col * cellSize + cellSize / 2;
        const cy = pad + row * cellSize + cellSize / 2;

        ctx.drawImage(clockFaceCanvas, pad + col * cellSize + offset, pad + row * cellSize + offset, radius * 2, radius * 2);

        const c = clocks[idx];

        drawHand(cx, cy, c.angleB, lenB, thickB, shadowOffsetPx*0.8, shadowBlurPx);
        drawHand(cx, cy, c.angleA, lenA, thickA, shadowOffsetPx, shadowBlurPx);

        ctx.beginPath();
        ctx.arc(cx, cy, hubR, 0, Math.PI * 2);
        ctx.closePath();
        ctx.fillStyle = rgba(handColor);
        ctx.fill();

        idx++;
      }
    }
  }

  function tick(tsMs) {
    requestAnimationFrame(tick);
    const nowSec = tsMs / 1000;

    if (colorTransition) {
      const t = clamp((nowSec - colorTransition.startSec) / colorTransition.duration, 0, 1);
      const eased = smoothStep(t);
      backColor = lerpColor(colorTransition.startBack, colorTransition.targetBack, eased);
      handColor = lerpColor(colorTransition.startHand, colorTransition.targetHand, eased);
      shadowColor = lerpColor(colorTransition.startShadow, colorTransition.targetShadow, eased);
      document.getElementById('clock-container').style.backgroundColor = `rgb(${backColor.r}, ${backColor.g}, ${backColor.b})`;
      rerenderClockFace();
      updateModalTheme();
      if (t >= 1) {
        backColor = { ...colorTransition.targetBack };
        handColor = { ...colorTransition.targetHand };
        shadowColor = { ...colorTransition.targetShadow };
        colorTransition = null;
        rerenderClockFace();
        updateModalTheme();
      }
    }

    if (!mouseFollowActive) {
      if (nowSec >= nextPatternSwitchSec) {
        patternIndex = (patternIndex + 1) % totalPattern;
        applyPattern(patternIndex, nowSec);
        isAnimating = true;
        do {
          nextPatternSwitchSec += PatternPeriodSeconds;
        } while (nowSec >= nextPatternSwitchSec);
      }
    } else {
      let idx = 0;
      for (let row = 0; row < Rows; row++) {
        for (let col = 0; col < Cols; col++) {
          const cx = pad + col * cellSize + cellSize / 2;
          const cy = pad + row * cellSize + cellSize / 2;
          const dx = mouseCanvasX - cx;
          const dy = mouseCanvasY - cy;
          let targetAngle = Math.atan2(dx, -dy) * 180 / Math.PI;
          targetAngle = normalizeDeg(targetAngle);

          const currentAngle = clocks[idx].angleA;
          const delta = shortestDeltaDeg(currentAngle, targetAngle);
          const newAngle = normalizeDeg(currentAngle + delta * MOUSE_FOLLOW_SMOOTHING);
          clocks[idx].angleA = newAngle;
          clocks[idx].angleB = newAngle;
          clocks[idx].animA = null;
          clocks[idx].animB = null;
          idx++;
        }
      }
      isAnimating = true;
    }

    let anyMoving = false;
    if (isAnimating) {
      for (const c of clocks) {
        c.update(nowSec);
        if (c.animA || c.animB) anyMoving = true;
      }
      isAnimating = anyMoving || mouseFollowActive;
    }

    if (nowSec - lastRenderSec < FRAME_INTERVAL) return;
    lastRenderSec = nowSec;
    draw(nowSec);
  }

      { name: 'White on Black', hand: { r: 255, g: 255, b: 255, a: 1.0 }, back: { r: 0, g: 0, b: 0, a: 1.0 }, shadow: { r: 50, g: 50, b: 50, a: 0.61 } },
      { name: 'Navy', hand: { r: 255, g: 255, b: 255, a: 1.0 }, back: { r: 24, g: 34, b: 65, a: 1.0 }, shadow: { r: 10, g: 15, b: 20, a: 0.61 } },
      { name: 'Forest', hand: { r: 230, g: 230, b: 230, a: 1.0 }, back: { r: 50, g: 61, b: 54, a: 1.0 }, shadow: { r: 20, g: 25, b: 22, a: 0.61 } },
      { name: 'Sand', hand: { r: 70, g: 50, b: 30, a: 1.0 }, back: { r: 240, g: 225, b: 210, a: 1.0 }, shadow: { r: 180, g: 160, b: 140, a: 0.6 } },
      { name: 'Gold', hand: { r: 50, g: 40, b: 0, a: 1.0 }, back: { r: 255, g: 215, b: 0, a: 1.0 }, shadow: { r: 200, g: 160, b: 0, a: 0.61 } },

      customSwatch.style.borderColor = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
      try {
        localStorage.setItem('clockTheme', JSON.stringify({ isCustom: true, back: backColor, hand: handColor }));
      } catch (err) {}
    });

    const hourFormatSetting = document.createElement('div');
    hourFormatSetting.className = 'setting setting-checkbox';
    hourFormatSetting.innerHTML = `
      <label for="hour-format-toggle">24‑hour format</label>
      <input type="checkbox" id="hour-format-toggle" ${is24Hour ? 'checked' : ''}>
    `;
    const themeSetting = document.querySelector('#settings-modal .setting');
    themeSetting.after(hourFormatSetting);

    document.getElementById('hour-format-toggle').addEventListener('change', (e) => {
      is24Hour = e.target.checked;
      if (patternIndex === 4) {
        const nowSec = performance.now() / 1000;
        applyPattern(4, nowSec);
        isAnimating = true;
      }
    });

    document.addEventListener('fullscreenchange', () => {
      const controls = document.querySelector('.controls');
      if (document.fullscreenElement) {
        controls.style.display = 'none';
        settingsModal.style.display = 'none';
      } else {
        controls.style.display = 'flex';
      }
    });

    settingsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isHidden = settingsModal.style.display === 'none' || !settingsModal.style.display;
      settingsModal.style.display = isHidden ? 'block' : 'none';
    });

    transitionSlider.value = TransitionSeconds;
    transitionValue.textContent = `${TransitionSeconds.toFixed(1)}s`;
    transitionSlider.addEventListener('input', () => {
      TransitionSeconds = parseFloat(transitionSlider.value);
      transitionValue.textContent = `${TransitionSeconds.toFixed(1)}s`;
    });

    applyColorsInstant();
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      const nowSec = performance.now() / 1000;
      patternIndex = 4;
      applyPattern(patternIndex, nowSec);
      nextPatternSwitchSec = nowSec + PatternPeriodSeconds;
      isAnimating = true;
      e.preventDefault();
    }
    else if (e.code === 'KeyC') {
      const nowSec = performance.now() / 1000;
      if (!mouseFollowActive) {
        patternIndex = (patternIndex + 1) % totalPattern;
        applyPattern(patternIndex, nowSec);
        nextPatternSwitchSec = nowSec + PatternPeriodSeconds;
        isAnimating = true;
      }
      e.preventDefault();
    }
    else if (e.code === 'KeyF') {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    } 
    else if (e.code === 'KeyH') {
      const settingsModal = document.getElementById('settings-modal');
      if (settingsModal) {
        const isHidden = settingsModal.style.display === 'none' || !settingsModal.style.display;
        settingsModal.style.display = isHidden ? 'block' : 'none';
      }
      e.preventDefault();
    }
    else if (e.code === 'KeyM') {
      const nowSec = performance.now() / 1000;
      if (!mouseFollowActive) {
        lastPatternIndexBeforeMouse = patternIndex;
        mouseFollowActive = true;
        isAnimating = true;
      } else {
        mouseFollowActive = false;
        applyPattern(lastPatternIndexBeforeMouse, nowSec);
        nextPatternSwitchSec = nowSec + PatternPeriodSeconds;
        isAnimating = true;
      }
      e.preventDefault();
    }
    else if (e.code === 'KeyR') {
      const randomColor = () => ({
        r: Math.floor(Math.random() * 256),
        g: Math.floor(Math.random() * 256),
        b: Math.floor(Math.random() * 256),
        a: 1.0
      });
      const newBack = randomColor();
      const newHand = randomColor();
      startColorTransition(newBack, newHand, deriveShadow(newBack));

      const customSwatch = document.querySelector('.color-swatch[title="Custom"]');
      if (customSwatch) {
        customSwatch.style.background = `rgb(${newBack.r}, ${newBack.g}, ${newBack.b})`;
        customSwatch.style.borderColor = `rgb(${newHand.r}, ${newHand.g}, ${newHand.b})`;
      }
      const customBgInput = document.getElementById('custom-background');
      const customHandInput = document.getElementById('custom-hand');
      if (customBgInput) customBgInput.value = rgbToHex(newBack.r, newBack.g, newBack.b);
      if (customHandInput) customHandInput.value = rgbToHex(newHand.r, newHand.g, newHand.b);

      isCustomActive = true;
      activeThemeIndex = -1;
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
      if (customSwatch) customSwatch.classList.add('active');
      const customPickers = document.getElementById('custom-color-pickers');
      if (customPickers) customPickers.style.display = 'block';

      try {
        localStorage.setItem('clockTheme', JSON.stringify({ isCustom: true, back: newBack, hand: newHand }));
      } catch (err) {}
      e.preventDefault();
    }
  });

  window.addEventListener('resize', resize);

  createClocks();
  resize();
  
  document.getElementById('clock-container').style.backgroundColor = '#ffffff';

  const nowSec = performance.now() / 1000;
  patternIndex = 4;
  applyPattern(patternIndex, nowSec);
  nextPatternSwitchSec = nowSec + PatternPeriodSeconds;
  isAnimating = true;
  lastRenderSec = 0;

  requestAnimationFrame(tick);
  setupControls();
})();
</script>
</body>
</html>
